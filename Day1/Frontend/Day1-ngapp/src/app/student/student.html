<h2>Student List</h2>

<input type="text" [(ngModel)]="StudentName" placeholder="Student Name">

<input type="number" [(ngModel)]="StudentRoll" placeholder="Roll Number">

<button (click)="addstudent()">Add Student</button>

<hr>

@for(student of students ; track student.StudentRoll){

    <p>Name: {{ student.StudentName }}</p>
    <p>Roll No: {{ student.StudentRoll }}</p>
}
